name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的现有版本标签，例如 v1.3.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release-tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          $releaseJson = & gh release view $env:RELEASE_TAG `
            --repo '${{ github.repository }}' `
            --json isDraft 2>$null

          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Release already published: $env:RELEASE_TAG"
            }
          } else {
            & gh release create $env:RELEASE_TAG `
              --repo '${{ github.repository }}' `
              --verify-tag `
              --draft `
              --generate-notes `
              --title $env:RELEASE_TAG
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create draft release: $env:RELEASE_TAG"
            }
          }

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            jbr-archive: jbrsdk-21.0.11-linux-x64-b1163.116.tar.gz
            jbr-sha512: 13d0aab4bcfa9e4f77a696b97d3998f7e82e22f7f1362d8ce97f0d50d69dddd9331a66ada3fe92c04e544795fc247bcbaf586ad0415df4eda5e0e0505753888f
            task: packageDeb packageRpm createDistributable
            portable-id: linux-x64
            portable-directory: Onyx
            artifact-path: |
              composeApp/build/compose/binaries/main/deb/*.deb
              composeApp/build/compose/binaries/main/rpm/*.rpm
              composeApp/build/compose/portable/*.zip
          - os: windows-latest
            jbr-archive: jbrsdk-21.0.11-windows-x64-b1163.116.zip
            jbr-sha512: 457c15d931bb5055ae97574fc7d899aa70917c266d4b40a1c50d949ff1d2b431eb95ad078b2038bd94561fbd57889803f867dd9c295868fbb0c3c870f1f4d1d3
            task: packageMsi createDistributable
            portable-id: windows-x64
            portable-directory: Onyx
            artifact-path: |
              composeApp/build/compose/binaries/main/msi/*.msi
              composeApp/build/compose/portable/*.zip
          # 7-Zip-JBinding 16.02 仅提供 Mac x86_64 native，发布任务必须固定 Intel runner。
          - os: macos-15-intel
            jbr-archive: jbrsdk-21.0.11-osx-x64-b1163.116.tar.gz
            jbr-sha512: efe9b3636804a1f7089414b10b77b53adf108b566b751eef483c0507197c8282b8459419c5a0f37fd67ad5e64111650069f70ea8ba8abf451078d6900045c88a
            task: packageDmg createDistributable
            portable-id: macos-x64
            portable-directory: Onyx.app
            artifact-path: |
              composeApp/build/compose/binaries/main/dmg/*.dmg
              composeApp/build/compose/portable/*.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Download pinned JetBrains Runtime SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archivePath = Join-Path $env:RUNNER_TEMP '${{ matrix.jbr-archive }}'
          $downloadUrl = 'https://cache-redirector.jetbrains.com/intellij-jbr/${{ matrix.jbr-archive }}'

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }

          $actualSha512 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actualSha512 -ne '${{ matrix.jbr-sha512 }}') {
            throw "JBR SDK SHA-512 mismatch: $actualSha512"
          }
          "JBR_ARCHIVE=$archivePath" >> $env:GITHUB_ENV

      - name: Setup JetBrains Runtime SDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'jdkfile'
          java-version: '21.0.11'
          jdkFile: ${{ env.JBR_ARCHIVE }}

      - name: Verify JetBrains Runtime SDK
        shell: pwsh
        run: |
          $runtimeProperties = (& java -XshowSettings:properties -version 2>&1 | Out-String)
          if ($runtimeProperties -notmatch 'java\.vendor\s*=\s*JetBrains') {
            throw "Release packages require JetBrains Runtime.`n$runtimeProperties"
          }
          Get-Command jpackage -ErrorAction Stop | Out-Null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify code and behavior
        run: ./gradlew jvmTest detekt

      - name: Build packages
        run: ./gradlew ${{ matrix.task }}

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Resolve-Path 'composeApp/build/compose/binaries/main/app'
          $sourcePath = Join-Path $sourceRoot '${{ matrix.portable-directory }}'
          if (-not (Test-Path -LiteralPath $sourcePath)) {
            throw "Portable application directory was not generated: $sourcePath"
          }

          $version = '${{ needs.prepare-release.outputs.tag }}'.TrimStart('v')
          $outputDirectory = (New-Item -ItemType Directory -Force 'composeApp/build/compose/portable').FullName
          $archivePath = Join-Path $outputDirectory "Onyx-${{ matrix.portable-id }}-$version.zip"

          if ($IsMacOS) {
            & ditto -c -k --sequesterRsrc --keepParent $sourcePath $archivePath
            if ($LASTEXITCODE -ne 0) {
              throw "ditto failed to create portable ZIP: $archivePath"
            }
          } elseif ($IsLinux) {
            Push-Location $sourceRoot
            try {
              & zip -qry -y $archivePath '${{ matrix.portable-directory }}'
              if ($LASTEXITCODE -ne 0) {
                throw "zip failed to create portable ZIP: $archivePath"
              }
            } finally {
              Pop-Location
            }
          } else {
            Push-Location $sourceRoot
            try {
              & tar -a -c -f $archivePath '${{ matrix.portable-directory }}'
              if ($LASTEXITCODE -ne 0) {
                throw "tar failed to create portable ZIP: $archivePath"
              }
            } finally {
              Pop-Location
            }
          }

          if (-not (Test-Path -LiteralPath $archivePath)) {
            throw "Failed to create portable ZIP: $archivePath"
          }

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          ARTIFACT_PATHS: ${{ matrix.artifact-path }}
        run: |
          $files = @(
            $env:ARTIFACT_PATHS -split '\r?\n' |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              ForEach-Object {
                Get-ChildItem -Path $_.Trim() -File -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName
              }
          )

          if ($files.Count -eq 0) {
            throw 'No release assets were generated'
          }

          & gh release upload $env:RELEASE_TAG @files `
            --repo '${{ github.repository }}' `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release assets: $env:RELEASE_TAG"
          }

  release:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          $releaseJson = & gh release view $env:RELEASE_TAG `
            --repo '${{ github.repository }}' `
            --json assets,isDraft
          if ($LASTEXITCODE -ne 0) {
            throw "Draft release not found: $env:RELEASE_TAG"
          }

          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft) {
            throw "Release is not a draft: $env:RELEASE_TAG"
          }
          if ($release.assets.Count -ne 7) {
            throw "Expected 7 release assets, found $($release.assets.Count)"
          }

          & gh release edit $env:RELEASE_TAG `
            --repo '${{ github.repository }}' `
            --draft=false
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish release: $env:RELEASE_TAG"
          }
